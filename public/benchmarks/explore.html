<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live switch technique comparison</title><style>body{margin:0;font:15px/1.6 system-ui;background:#edf3f7;color:#18313e}header{padding:24px;background:#063c59;color:white}a{color:inherit}.controls{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:20px}select,button{font:inherit;padding:8px 12px;border-radius:6px;border:1px solid #93aebb}button{background:#007f80;color:white;cursor:pointer}.note{padding:0 20px;margin:0 0 20px}.viewport{overflow:auto;max-height:75vh;margin:0 20px 20px;border:1px solid #93aebb}iframe{display:block;border:0;width:1920px;height:1440px}</style></head><body><header><a href="/benchmarks/">← Stress graphs</a><h1>Explore the isolated techniques</h1></header><div class="controls"><label>Technique <select id="method"><option value="slidebox">Slidebox margins</option><option value="edge">Staggered left/right edges</option><option value="translate">Transform slide (no stretch)</option><option value="grid-track">Grid slide (no stretch)</option><option value="native">Native checkbox</option></select></label><label>Count <select id="count"><option>500</option><option selected>2000</option></select></label><label><input id="hint" type="checkbox"> Property-specific will-change</label><button id="render">Render scene</button><button id="toggle">Toggle all together</button></div><p class="note">This is for visual inspection, not recording benchmark results. The frame retains the benchmark's 1920×1440 layout; scroll it on smaller screens. Margins and edges stretch, while the transform/grid baselines only slide.</p><div class="viewport"><iframe id="lab" src="lab.html" title="Isolated switch scene"></iframe></div><script>const frame=document.getElementById('lab');let checked=false;function render(){checked=false;frame.contentWindow.configure({variant:document.getElementById('method').value,count:Number(document.getElementById('count').value),hint:document.getElementById('hint').checked})}frame.addEventListener('load',render);document.getElementById('render').addEventListener('click',render);document.getElementById('toggle').addEventListener('click',()=>{checked=!checked;for(const input of frame.contentDocument.querySelectorAll('#grid input'))input.checked=checked});</script></body></html>
