<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Switch technique benchmark</title>
<link rel="stylesheet" href="slidebox.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#e8f6fa;font:14px system-ui}header{height:70px;padding:15px 24px}header p{margin:0;color:#a1c7d8;font-size:12px}#grid{display:grid;grid-template-columns:repeat(40,40px);gap:6px;padding:0 24px;width:max-content}.unit{width:40px;height:20px;font-size:20px;margin:0;padding:0;border:1px solid #5289a6;border-radius:100vw;background:#2a5b7c;appearance:none;-webkit-appearance:none;position:relative;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;--slidebox-size:20px;--slidebox-width:2;--slidebox-spacing:.33;--slidebox-deform:.1;--slidebox-duration:200ms;--slidebox-easing:ease-in-out;--slidebox-track:#2a5b7c;--slidebox-border:#5289a6;--slidebox-off:#e8f6fa;--slidebox-on:#00b2b2}.unit:where(:not(.slidebox):not(.native))::after{content:"";position:absolute;top:2.3px;height:13.4px;box-sizing:border-box;min-width:0;border:1px solid #2a5b7c;border-radius:100vw;background:#e8f6fa}.unit:not(.slidebox):checked::after{background:#00b2b2}.edge::after{left:3.3px;right:23.3px;transition:background 200ms ease-in-out,left 200ms ease-in-out,right 200ms ease-in-out;transition-delay:0s,0s,20ms}.edge:checked::after{left:23.3px;right:3.3px;transition-delay:0s,20ms,0s}.translate::after{left:3.3px;width:11.4px;transform:translateX(0);transition:background 200ms ease-in-out,transform 200ms ease-in-out}.translate:checked::after{transform:translateX(20px)}.unit.grid-track{display:inline-grid;grid-template-columns:0fr 11.4px 1fr;padding-inline:3.3px;transition:grid-template-columns 200ms ease-in-out}.unit.grid-track:checked{grid-template-columns:1fr 11.4px 0fr}.unit.grid-track::after{position:relative;top:0;grid-column:2;grid-row:1;align-self:center;width:100%;transition:background 200ms ease-in-out}.unit.native{appearance:auto;-webkit-appearance:auto;background:none;border:0;width:20px;justify-self:center;accent-color:#00b2b2}.hint .slidebox::after{will-change:margin-inline-start,margin-inline-end}.hint .edge::after{will-change:left,right}.hint .translate::after{will-change:transform}.hint .grid-track{will-change:grid-template-columns}
</style></head><body><header><strong id="title">Normalized switch techniques</strong><p>40 × 20px cells · all controls in the viewport · no glass, shadows, pointer effects, or continuous page animations</p></header><div id="grid"></div>
<script>
const names={slidebox:'Slidebox margins',edge:'Staggered left/right',translate:'Transform slide (no deformation)','grid-track':'Grid-track slide (no deformation)',native:'Native checkbox (no animation)'};
window.configure=({variant,count,hint})=>{
 document.body.classList.toggle('hint',hint);document.getElementById('title').textContent=`${names[variant]} · ${count} controls · will-change ${hint?'on':'off'}`;
 const fragment=document.createDocumentFragment();for(let i=0;i<count;i++){const input=document.createElement('input');input.type='checkbox';input.className='unit '+variant;input.setAttribute('aria-label','Benchmark switch '+(i+1));fragment.append(input)}document.getElementById('grid').replaceChildren(fragment);
 const last=document.querySelector('#grid input:last-child').getBoundingClientRect();return{visible:last.bottom<=innerHeight&&last.right<=innerWidth,viewport:[innerWidth,innerHeight],lastBottom:last.bottom};
};
function clsScore(entries){let max=0,sum=0,start=0,last=0;for(const e of entries.filter(e=>!e.hadRecentInput)){if(!sum||e.startTime-last>1000||e.startTime-start>5000){sum=e.value;start=e.startTime}else sum+=e.value;last=e.startTime;max=Math.max(max,sum)}return max}
window.runTrial=()=>new Promise(resolve=>{
 const inputs=[...document.querySelectorAll('#grid input')];const shifts=[],longTasks=[],loafs=[],frames=[],toggles=[],observers=[];const start=performance.now();let last;
 for(const [type,target]of[['layout-shift',shifts],['longtask',longTasks],['long-animation-frame',loafs]]){if(!PerformanceObserver.supportedEntryTypes.includes(type))continue;const observer=new PerformanceObserver(list=>{for(const e of list.getEntries())target.push({startTime:e.startTime,value:e.value??0,hadRecentInput:e.hadRecentInput??false,duration:e.duration??0,blockingDuration:e.blockingDuration??0})});observer.observe({type});observers.push(observer)}
 function toggle(value){const begin=performance.now();for(const input of inputs)input.checked=value;toggles.push({begin,end:performance.now(),value})}
 setTimeout(()=>toggle(true),50);setTimeout(()=>toggle(false),500);
 function frame(now){if(last!==undefined)frames.push({begin:last,end:now,dt:now-last});last=now;if(now-start<1000){requestAnimationFrame(frame);return}setTimeout(()=>{for(const o of observers)o.disconnect();const active=frames.filter(f=>toggles.some(t=>f.end>t.begin&&f.begin<t.begin+300));const intervals=active.map(f=>f.dt);const mean=intervals.reduce((a,b)=>a+b,0)/(intervals.length||1);const sorted=[...intervals].sort((a,b)=>a-b);resolve({elapsedMs:performance.now()-start,rafFps:mean?1000/mean:0,frameIntervals:intervals,p95FrameMs:sorted[Math.max(0,Math.ceil(sorted.length*.95)-1)]??null,longIntervalPercent:intervals.length?intervals.filter(n=>n>25).length/intervals.length*100:0,estimatedMissed60HzSlots:intervals.reduce((sum,n)=>sum+Math.max(0,Math.round(n/(1000/60))-1),0),toggleScriptMs:toggles.reduce((sum,t)=>sum+t.end-t.begin,0),layoutShiftEntries:shifts.length,layoutShiftRawSum:shifts.reduce((s,e)=>s+e.value,0),cls:clsScore(shifts),longTasks:longTasks.length,longTaskBlockingMs:longTasks.reduce((s,e)=>s+Math.max(0,e.duration-50),0),longAnimationFrames:loafs.length,loafBlockingMs:loafs.reduce((s,e)=>s+e.blockingDuration,0),toggles: toggles.map(t=>({atMs:t.begin-start,scriptMs:t.end-t.begin,value:t.value}))})},0)}requestAnimationFrame(frame);
});
</script></body></html>
